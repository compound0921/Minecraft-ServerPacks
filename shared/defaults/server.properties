#Minecraft server properties
# 这是服务器首次启动前的最小配置。服务端启动时会把缺失的项按当前版本补全，
# 并把完整内容写回这个文件，所以这里只放需要非默认值的项即可。
online-mode=false
motd=A Minecraft Server
max-players=20
difficulty=easy
gamemode=survival
pvp=true
white-list=false
server-port=25565
view-distance=10
simulation-distance=10
allow-flight=false
spawn-protection=16
level-name=world
